<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Радио</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== FULL PLAYER ===== -->
<div id="full-player" class="full-player hidden">
    <div class="fp-drag">
        <button class="fp-close" id="fp-close">
            <svg viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
        </button>
    </div>
    <div class="fp-art" id="fp-art">
        <img id="fp-logo" class="fp-logo hidden" alt="">
        <span id="fp-initials" class="fp-initials"></span>
        <div class="fp-waves" id="fp-waves">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>
    <div class="fp-meta-row">
        <div class="fp-left">
            <div class="fp-name" id="fp-name">Выберите станцию</div>
            <div class="fp-sub" id="fp-sub">—</div>
        </div>
        <button class="fp-fav" id="fp-fav" title="Избранное">
            <svg viewBox="0 0 24 24"><path id="fp-fav-path" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
        </button>
    </div>
    <div class="fp-controls">
        <button class="fp-btn fp-prev" id="fp-prev" title="Предыдущая">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="fp-btn fp-play" id="fp-play">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="fp-btn fp-next" id="fp-next" title="Следующая">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>
    <div class="fp-vol-row">
        <svg class="vol-ico" viewBox="0 0 24 24"><path d="M5 9v6h4l5 5V4L9 9H5z"/></svg>
        <input type="range" id="fp-vol" min="0" max="100" value="100">
        <svg class="vol-ico" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>
    <a class="fp-home" id="fp-home" href="#" target="_blank" rel="noopener">🌐 Сайт станции</a>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="app">
    <div class="app-header">
        <h1 class="app-title">📻 Радио</h1>
        <div class="header-sub" id="station-count">Загрузка...</div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
        <div class="search-box">
            <svg class="search-ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="search-input" placeholder="Искать станции по всему миру...">
            <button class="search-clear hidden" id="search-clear">✕</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-row">
            <div class="select-wrap">
                <svg class="select-ico" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <select id="country-sel" class="country-sel">
                    <option value="">🌍 Весь мир</option>
                </select>
            </div>
            <button class="filter-refresh" id="btn-refresh" title="Обновить">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
        <div class="genres-scroll" id="genres"></div>
    </div>

    <!-- Section title -->
    <div class="section-hdr">
        <span id="section-title">Популярные</span>
        <span id="station-count-small" class="count-badge"></span>
    </div>

    <!-- Stations list -->
    <div class="stations-list" id="stations-list"></div>

    <!-- Load more -->
    <div class="load-more-wrap" id="load-more-wrap" style="display:none">
        <button class="load-more-btn" id="load-more-btn">Загрузить ещё</button>
    </div>

    <div style="height:80px"></div>
</div>

<!-- ===== MINI PLAYER ===== -->
<div class="mini-player hidden" id="mini-player">
    <div class="mp-info" id="mp-open">
        <div class="mp-art" id="mp-art">
            <img id="mp-logo" class="mp-logo hidden" alt="">
            <span id="mp-initials"></span>
            <div class="mp-eq hidden" id="mp-eq">
                <span></span><span></span><span></span>
            </div>
        </div>
        <div class="mp-text">
            <div class="mp-name" id="mp-name">Выберите станцию</div>
            <div class="mp-status" id="mp-status"></div>
        </div>
    </div>
    <div class="mp-btns">
        <button class="mp-btn" id="mp-play">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>
</div>

<!-- Loading -->
<div id="loading" class="loading hidden"><div class="spinner"></div></div>

<!-- Notification -->
<div id="notif" class="notif"></div>

<script src="script.js"></script>
</body>
</html>
