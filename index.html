<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Интернет-Радио</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <span>Загрузка...</span>
    </div>

    <!-- Player Bar (fixed top) -->
    <div class="player-bar" id="player-bar">
        <div class="player-left">
            <div class="station-icon" id="station-icon">
                <span>📻</span>
            </div>
            <div class="player-info">
                <div class="player-station-name" id="player-station-name">Выберите станцию</div>
                <div class="player-meta">
                    <span class="on-air-tag" id="on-air-tag">
                        <span class="on-air-dot"></span>
                        В ЭФИРЕ
                    </span>
                    <div class="sound-waves" id="sound-waves">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn" id="btn-play-pause" aria-label="Play/Pause">
                <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="24" height="24" class="hidden">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
            <button class="ctrl-btn mute-btn" id="btn-mute" aria-label="Mute">
                <svg id="icon-vol" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <svg id="icon-mute" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" class="hidden">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
            <div class="volume-wrap">
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80" aria-label="Volume">
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Search Bar -->
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Поиск станций..." autocomplete="off">
            <button class="search-clear hidden" id="search-clear" aria-label="Clear search">✕</button>
        </div>

        <!-- Categories -->
        <div class="categories-wrap" id="categories-wrap">
            <div class="categories-scroll" id="categories-scroll">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Radio Grid -->
        <div class="radio-list" id="radio-list">
            <!-- Filled by JS -->
        </div>
    </main>

    <!-- Notification -->
    <div class="notification hidden" id="notification"></div>

    <script src="script.js"></script>
</body>
</html>
